version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: terra-sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: terra_sentinel_db
      POSTGRES_USER: terra_sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-terra_sentinel_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terra_sentinel -d terra_sentinel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: terra-sentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: terra-sentinel-chromadb
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  mcp-hub:
    build:
      context: .
      dockerfile: mcp_hub/Dockerfile
    container_name: terra-sentinel-mcp-hub
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - redis

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terra-sentinel-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - MCP_HUB_URL=http://mcp-hub:8001/mcp/invoke
      - DATABASE_URL=postgresql://terra_sentinel:${DB_PASSWORD:-terra_sentinel_secure_password}@postgres:5432/terra_sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-hub:
        condition: service_started

volumes:
  pgdata:
  chromadata:
